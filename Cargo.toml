cargo-features = ["profile-rustflags", "trim-paths"]

[package]
name = "ace8-savecrypt"
version = "0.1.0"
edition = "2024"

[lib]
name = "ace8_savecrypt"
path = "src/lib.rs"

[[bin]]
name = "ace8-savecrypt"
path = "src/main.rs"

[dependencies]
aes = "0.9"
cipher = "0.5"
cbc = { version = "0.2", features = ["block-padding", "alloc"] }
crc32fast = "1.5"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.23.1"


[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3
panic = "abort"
trim-paths = "all"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]
